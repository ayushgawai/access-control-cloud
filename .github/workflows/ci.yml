name: ci
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m app.loadtest inproc --doors 5000 --events 5

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: ui/test-results }

  compose-postgres-loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: SEED_DOORS=5000 docker compose up -d --build --wait db api
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx websockets
      - run: python -m app.loadtest ws --doors 5000 --events 5
      - run: docker compose logs api | tail -50
        if: always()

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infra/terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate
