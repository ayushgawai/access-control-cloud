<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Access Control Admin</title>
    <style>
      :root { --bg: #0f1419; --panel: #171d24; --line: #26303a; --text: #d9e1e8; --dim: #8796a5;
              --accent: #4fb3ff; --ok: #3ccf91; --bad: #ff6b6b; --warn: #ffb84d; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
      header { display: flex; gap: 1rem; align-items: center; padding: .75rem 1.25rem; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 1rem; margin: 0 auto 0 0; letter-spacing: .02em; }
      nav { display: flex; gap: .25rem; padding: .75rem 1.25rem 0; }
      main { padding: 1rem 1.25rem; overflow-x: auto; }
      button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
               padding: .35rem .7rem; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
      button.primary { background: var(--accent); color: #04121f; border-color: var(--accent); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }
      code { font: 12px ui-monospace, monospace; color: var(--dim); }
      .tag { display: inline-block; padding: 0 .45rem; border-radius: 999px; font-size: 12px; border: 1px solid; }
      .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
      .center { display: grid; place-items: center; min-height: 80vh; text-align: center; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-top: 1rem; }
      .bar { display: flex; gap: .75rem; align-items: center; margin-bottom: .75rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
